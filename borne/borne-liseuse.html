<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liseuse — Borne Insert Koin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=IM+Fell+English+SC&amp;display=swap" rel="stylesheet">
<style>
:root{--paper:#e9dfc8;--ink:#2e2213;--brass1:#f0d58c;--brass2:#b8892f;--wood:#3a2416}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--paper);background-image:radial-gradient(rgba(120,90,40,.06) 1px,transparent 1.4px);background-size:5px 5px;color:var(--ink);font-family:'IM Fell English',Georgia,serif}
.shelf{display:flex;gap:6px;padding:8px 8px 0;background:linear-gradient(180deg,#1c120a,#2b1c10);box-shadow:inset 0 -5px 0 #7a5530;overflow-x:auto;flex:none}
.shelf button{flex:1 0 118px;min-height:52px;border:0;border-radius:3px 3px 1px 1px;padding:6px 8px;cursor:pointer;font:15px/1.1 'IM Fell English',serif;color:#f3e7c8;box-shadow:inset 3px 0 0 rgba(255,255,255,.12),inset -3px 0 0 rgba(0,0,0,.3)}
.shelf button small{display:block;font-size:12px;opacity:.85}
.shelf button[aria-pressed=true]{outline:2px solid var(--brass1);outline-offset:-2px}
.view{position:relative;flex:1 1 auto;min-height:0;display:flex;gap:18px;padding:12px 16px;overflow:hidden}
.page{position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;overflow:auto;cursor:zoom-in}
.page.z{cursor:zoom-out;align-items:flex-start;justify-content:flex-start}
.page img{max-width:100%;max-height:100%;box-shadow:0 4px 14px rgba(60,40,10,.35);background:#fff}
.page.z img{max-width:none;max-height:none;width:200%}
.side{flex:0 0 clamp(150px,30%,260px);display:flex;flex-direction:column;gap:8px;padding-top:4px}
.side .au{font-family:'IM Fell English SC',serif;font-size:15px;letter-spacing:.05em;color:#7a5a2a}
.side .ti{font-style:italic;font-size:clamp(20px,2.6vw,28px);line-height:1.05}
.side .ed{font-size:15px}
.side .src{margin-top:auto;font:12px/1.4 Georgia,serif;color:#6b5a3e}
.side a{color:#7a4f1d}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px;background:linear-gradient(180deg,#4a2f1c,#2a1a0e);border-top:3px solid var(--brass2)}
.bar button{height:40px;min-width:48px;padding:0 12px;border:0;border-radius:20px;cursor:pointer;background:linear-gradient(180deg,var(--brass1),var(--brass2) 60%,#8a6320);color:#2b1c08;font:16px 'IM Fell English SC',serif;box-shadow:0 3px 0 #4a3210,inset 0 1px 0 rgba(255,255,255,.6)}
.bar output{min-width:96px;text-align:center;color:#f0d58c;font:15px 'IM Fell English',serif}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:italic;color:#7a5a2a;pointer-events:none}
@media (max-width:640px){.view{flex-direction:column;padding:8px}.side{flex:none;flex-direction:row;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.side .src{margin:0;width:100%}}
</style>
</head>
<body>
<nav class="shelf" id="shelf" aria-label="Étagère"></nav>
<main class="view">
<div class="page" id="page"><img id="img" alt=""><div class="wait" id="wait"></div></div>
<aside class="side" aria-live="polite">
<span class="au" id="au"></span><span class="ti" id="ti"></span><span class="ed" id="ed"></span>
<span class="src" id="src"></span>
</aside>
</main>
<div class="bar">
<button type="button" id="prev" aria-label="Page précédente">◀</button>
<output id="num"></output>
<button type="button" id="next" aria-label="Page suivante">▶</button>
<button type="button" id="zoom" aria-label="Loupe">Loupe</button>
</div>
<script>
/* Liseuse de la borne : fac-similés du domaine public, page par page, depuis Internet Archive.
   Rien n'est stocké ici : chaque page vient de archive.org au fil de la lecture. */
(function(){
  var BOOKS=[
    {id:'atalantafugiensh00maie',n:232,start:20,au:'Michael Maier',ti:'Atalanta fugiens',ed:'Oppenheim, Johann Theodor de Bry, 1618',c:'#6b1f1a'},
    {id:'b14557551_0002',n:44,start:0,au:'Altus',ti:'Mutus liber',ed:'La Rochelle, Pierre Savouret, 1677',c:'#2f3f2a'},
    {id:'BIUSante_pharma_res011411',n:581,start:221,au:'Anonyme',ti:'Rosarium philosophorum',ed:'Artis auriferae, vol. II, Bâle, Conrad Waldkirch, 1593',c:'#3a2a52'},
    {id:'bub_gb_1JucGqXnWb4C',n:888,start:0,au:'Recueil',ti:'Musaeum hermeticum',ed:'Francfort, Hermann von Sand, 1678',c:'#5a3a1a'},
    {id:'cu31924012366088',n:232,start:0,au:'Trad. Arthur Edward Waite',ti:'The Turba Philosophorum',ed:'Londres, George Redway, 1896',c:'#1f2f44'}];
  var L=(function(){try{return localStorage.getItem('ik.lang')==='fr'?'fr':'en';}catch(e){return 'en';}})();
  var T={fr:{p:'page',w:'Page en chemin…',src:'Fac-similé du domaine public : ',full:'livre entier',zoom:'Loupe'},en:{p:'page',w:'Page on its way…',src:'Public-domain facsimile: ',full:'whole book',zoom:'Loupe'}}[L];
  document.documentElement.lang=L;
  var $=function(i){return document.getElementById(i);},img=$('img'),page=$('page'),b=null,leaf=0,saved={};
  try{saved=JSON.parse(localStorage.getItem('borne.liseuse')||'{}')||{};}catch(e){}
  var shelf=$('shelf');
  BOOKS.forEach(function(k,i){var s=document.createElement('button');s.type='button';s.style.background=k.c;s.innerHTML=k.ti+'<small>'+k.ed.replace(/^.*, /,'')+'</small>';s.onclick=function(){open(i);};shelf.appendChild(s);});
  function url(k,n){return 'https://archive.org/download/'+k.id+'/page/n'+n+'_w'+(page.classList.contains('z')?1800:1000)+'.jpg';}
  function show(){$('wait').textContent=T.w;img.style.opacity=.35;var u=url(b,leaf);img.onload=function(){$('wait').textContent='';img.style.opacity=1;};img.src=u;
    img.alt=b.ti+', '+T.p+' '+(leaf+1);$('num').textContent=T.p+' '+(leaf+1)+' / '+b.n;
    if(leaf+1<b.n){var p=new Image();p.src=url(b,leaf+1);}
    saved[b.id]=leaf;try{localStorage.setItem('borne.liseuse',JSON.stringify(saved));}catch(e){}}
  function open(i){b=BOOKS[i];leaf=saved[b.id]!=null?saved[b.id]:b.start;
    [].forEach.call(shelf.children,function(s,j){s.setAttribute('aria-pressed',j===i?'true':'false');});
    $('au').textContent=b.au;$('ti').textContent=b.ti;$('ed').textContent=b.ed;
    $('src').innerHTML=T.src+'<a href="https://archive.org/details/'+b.id+'" target="_blank" rel="noopener">Internet Archive</a> ('+T.full+')';
    page.classList.remove('z');show();}
  function step(d){if(!b)return;var n=Math.max(0,Math.min(b.n-1,leaf+d));if(n!==leaf){leaf=n;show();}}
  $('prev').onclick=function(){step(-1);};$('next').onclick=function(){step(1);};
  $('zoom').textContent=T.zoom;$('zoom').onclick=function(){page.classList.toggle('z');show();};
  page.addEventListener('click',function(e){if(e.target===img){page.classList.toggle('z');show();}});
  addEventListener('keydown',function(e){if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);});
  var x0=null;page.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  page.addEventListener('touchend',function(e){if(x0==null||page.classList.contains('z'))return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)step(dx<0?1:-1);x0=null;});
  open(0);
})();
</script>
</body>
</html>
