# One-off: removes the branches bio-watch and ref (moved to a private repository), then this file can go.
name: Cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git push origin --delete bio-watch || true
          git push origin --delete ref || true
