# Tells Bing, Yandex, Seznam, Naver (IndexNow) about every page of every site on mauktenieb.github.io.
# Runs on each push here, every Monday, and by hand (Actions > IndexNow > Run workflow).
name: IndexNow
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Collect URLs from the sitemaps and submit them
        run: |
          set -e
          sleep 120  # let Pages publish the key file first
          KEY=6a354d1980c7601df40472cf6be05d5e
          HOST=mauktenieb.github.io
          urls=$( (for s in sitemap.xml insertkoin/sitemap.xml 3615/sitemap.xml katabase/sitemap.xml; do
            curl -fsSL "https://$HOST/$s" 2>/dev/null | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' || true
          done; echo "https://$HOST/korhogo/") | sort -u)  # korhogo/ is retired: it now redirects to Insert Koin, submitted so engines see the move
          echo "$urls"
          n=$(echo "$urls" | grep -c . || true)
          echo "URLs: $n"
          [ "$n" -gt 0 ] || exit 1
          body=$(printf '%s\n' $urls | jq -R . | jq -s --arg h "$HOST" --arg k "$KEY" '{host:$h,key:$k,keyLocation:("https://"+$h+"/"+$k+".txt"),urlList:.}')
          code=$(curl -s -o /tmp/r -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow)
          echo "IndexNow answered $code"; cat /tmp/r || true
          case "$code" in 200|202) ;; *) exit 1;; esac
